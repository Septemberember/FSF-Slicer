name: Validate synthetic preview

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/generate_synthetic_preview.py
      - run: python3 scripts/validate_preview.py
      - run: git diff --exit-code
