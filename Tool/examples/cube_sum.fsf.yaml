method: smallestCubeSumIndex
inputs:
  x: {type: int, min: -20, max: 100}
outputs:
  return_value: {type: int, source: return, min: -1, max: 10}
scenarios:
  - id: T_nonpositive
    T: "x <= 0"
    D: "return_value == -1"
  - id: T_positive
    T: "x > 0"
    D: "((return_value - 1) * (return_value - 1) * return_value * return_value) / 4 < x && x <= (return_value * return_value * (return_value + 1) * (return_value + 1)) / 4"
analysis:
  max_paths: 32
  max_loop_iterations: 16
  solver_timeout_ms: 10000
  compare_original: true
  compile_slices: true
