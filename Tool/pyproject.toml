[build-system]
requires = ["setuptools>=77,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fsf-slicer-tbfv"
version = "2.0.0"
description = "FSF-guided Java program slicing and testing-based formal verification"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
authors = [{name = "FSF-Slicer contributors"}]
dependencies = [
  "javalang==0.13.0",
  "PyYAML==6.0.2",
  "setuptools<81",
  "z3-solver==4.12.2.0",
]

[project.scripts]
fsf-tbfv = "fsf_tool.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "build==1.6.1", "wheel==0.48.0"]

[tool.setuptools.packages.find]
include = ["fsf_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:pkg_resources is deprecated as an API.*:UserWarning"]
